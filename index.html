<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Preserver Trans LLC - Truck Availability</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: #d4af37;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      color: white;
      margin-top: 8px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .truck-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .truck-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      border-left: 5px solid #d4af37;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    .truck-card h3 {
      margin: 8px 0 15px;
    }

    .status {
      display: inline-block;
      background: #198754;
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .info {
      margin: 9px 0;
      line-height: 1.4;
    }

    .label {
      font-weight: bold;
    }

    .contact {
      display: block;
      margin-top: 18px;
      padding: 12px;
      background: #111;
      color: #d4af37;
      text-align: center;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }

    #loading {
      text-align: center;
      padding: 30px;
      font-size: 18px;
    }

    #message {
      text-align: center;
      padding: 20px;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Preserver Trans LLC</h1>
  <p>Truck Availability Board</p>
</header>

<div class="container">

  <div class="title">
    <h2>Available Trucks</h2>
    <p>Live Truck Availability</p>
  </div>

  <div id="loading">
    Loading trucks...
  </div>

  <div id="truckList" class="truck-list"></div>

  <div id="message"></div>

</div>

<footer>
  © 2026 Preserver Trans LLC | Dispatcher
</footer>

<script>

const SUPABASE_URL =
  "https://lriojwlaxemghavidsjt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_HFnwZD1cccBr6RsIDhZPbA_MxHGK0T6";


async function loadTrucks() {

  const loading = document.getElementById("loading");
  const list = document.getElementById("truckList");
  const message = document.getElementById("message");

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/trucks",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Database error");
    }

    const trucks = await response.json();

    loading.style.display = "none";

    if (trucks.length === 0) {
      message.innerHTML = "No trucks available.";
      return;
    }

    trucks.forEach(function(truck) {

      const card = document.createElement("div");

      card.className = "truck-card";

      card.innerHTML =
        '<span class="status">' +
        (truck.status || "Available") +
        '</span>' +

        '<h3>🚛 Truck #' +
        (truck.truck_number || "N/A") +
        '</h3>' +

        '<div class="info">' +
        '<span class="label">Driver:</span> ' +
        (truck.driver_name || "N/A") +
        '</div>' +

        '<div class="info">' +
        '<span class="label">Location:</span> ' +
        (truck.location || "N/A") +
        '</div>' +

        '<div class="info">' +
        '<span class="label">Available Date:</span> ' +
        (truck.available_date || "N/A") +
        '</div>' +

        '<div class="info">' +
        '<span class="label">Available Time:</span> ' +
        (truck.available_time || "N/A") +
        '</div>' +

        '<div class="info">' +
        '<span class="label">Lane:</span> ' +
        (truck.lane || "Any") +
        '</div>' +

        '<div class="info">' +
        '<span class="label">Equipment:</span> ' +
        (truck.equipment || "N/A") +
        '</div>' +

        '<div class="info">' +
        '<span class="label">Notes:</span> ' +
        (truck.notes || "None") +
        '</div>' +

        '<a class="contact" ' +
        'href="mailto:preservertrans79@gmail.com">' +
        'Contact Dispatcher' +
        '</a>';

      list.appendChild(card);
    });

  } catch (error) {

    loading.style.display = "none";

    message.innerHTML =
      "Unable to load trucks.";

    console.log(error);
  }
}

loadTrucks();

</script>

</body>
</html>
