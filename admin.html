<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preserver Trans LLC - Admin</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #111;
  color: #d4af37;
  text-align: center;
  padding: 25px;
}

header h1 {
  margin: 0;
}

header p {
  color: white;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 7px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
}

.full {
  grid-column: 1 / -1;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 7px;
  background: #111;
  color: #d4af37;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #333;
}

#message {
  margin-top: 20px;
  text-align: center;
  font-weight: bold;
}

.back {
  display: block;
  text-align: center;
  margin-top: 20px;
}

@media(max-width:650px) {
  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>Preserver Trans LLC</h1>
  <p>Truck Availability - Admin Panel</p>
</header>

<div class="container">

<div class="box">

<h2>Add Available Truck</h2>

<form id="truckForm">

<div class="form-grid">

<div>
<label>Truck Number</label>
<input id="truck_number" required>
</div>

<div>
<label>Driver Name</label>
<input id="driver_name">
</div>

<div>
<label>Current Location</label>
<input id="location" required>
</div>

<div>
<label>Available Date</label>
<input id="available_date" type="date" required>
</div>

<div>
<label>Available Time</label>
<input id="available_time" type="time" required>
</div>

<div>
<label>Preferred Lane</label>
<input id="lane">
</div>

<div>
<label>Equipment</label>
<select id="equipment">
<option>53' Dry Van</option>
<option>53' Reefer</option>
<option>Flatbed</option>
<option>Other</option>
</select>
</div>

<div>
<label>Status</label>
<select id="status">
<option>Available</option>
<option>Booked</option>
<option>Not Available</option>
</select>
</div>

<div class="full">
<label>Notes</label>
<textarea id="notes"></textarea>
</div>

<div class="full">
<button type="submit">ADD TRUCK</button>
</div>

</div>

</form>

<div id="message"></div>

<a class="back" href="index.html">
← Back to Broker Page
</a>

</div>

</div>

<script>

const SUPABASE_URL =
"https://lriojwlaxemghavidsjt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HFnwZD1cccBr6RsIDhZPbA_MxHGK0T6";

document
.getElementById("truckForm")
.addEventListener("submit", async function(e) {

e.preventDefault();

const message =
document.getElementById("message");

message.innerHTML = "Saving truck...";

const truck = {

truck_number:
document.getElementById("truck_number").value,

driver_name:
document.getElementById("driver_name").value,

location:
document.getElementById("location").value,

available_date:
document.getElementById("available_date").value,

available_time:
document.getElementById("available_time").value,

lane:
document.getElementById("lane").value,

equipment:
document.getElementById("equipment").value,

status:
document.getElementById("status").value,

notes:
document.getElementById("notes").value

};

try {

const response = await fetch(
SUPABASE_URL + "/rest/v1/trucks",
{
method: "POST",

headers: {
"apikey": SUPABASE_KEY,
"Authorization": "Bearer " + SUPABASE_KEY,
"Content-Type": "application/json",
"Prefer": "return=minimal"
},

body: JSON.stringify(truck)

});

if (!response.ok) {

const errorText =
await response.text();

throw new Error(errorText);

}

message.innerHTML =
"✅ TRUCK ADDED SUCCESSFULLY!";

document
.getElementById("truckForm")
.reset();

}
catch(error) {

console.log(error);

message.innerHTML =
"❌ ERROR: " + error.message;

}

});

</script>

</body>
</html>
