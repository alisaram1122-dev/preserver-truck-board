<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preserver Trans LLC - Dispatcher</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #111;
  color: #d4af37;
  text-align: center;
  padding: 22px;
}

header p {
  color: white;
}

.container {
  max-width: 1000px;
  margin: 25px auto;
  padding: 15px;
}

.box {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 15px rgba(0,0,0,.12);
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

input,
select,
textarea {
  width: 100%;
  padding: 11px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 7px;
}

textarea {
  min-height: 80px;
}

label {
  font-weight: bold;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full {
  grid-column: 1 / -1;
}

button {
  border: 0;
  border-radius: 7px;
  padding: 11px 16px;
  cursor: pointer;
  font-weight: bold;
}

.login-btn,
.add-btn {
  width: 100%;
  background: #111;
  color: #d4af37;
  font-size: 16px;
}

.logout {
  background: #b02a37;
  color: white;
  float: right;
}

.edit {
  background: #d4af37;
  color: #111;
}

.delete {
  background: #b02a37;
  color: white;
}

#loginBox {
  max-width: 450px;
  margin: 40px auto;
}

#panel {
  display: none;
}

#message {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.truck {
  border: 1px solid #ddd;
  border-left: 5px solid #d4af37;
  border-radius: 8px;
  padding: 15px;
  margin-top: 15px;
}

.truck h3 {
  margin-top: 0;
}

.actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

@media(max-width:650px) {

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .actions {
    flex-direction: column;
  }

}

</style>
</head>

<body>

<header>

<h1>Preserver Trans LLC</h1>

<p>Dispatcher Management Panel</p>

</header>


<!-- LOGIN -->

<div id="loginBox" class="box">

<h2>🔐 Dispatcher Login</h2>

<form id="loginForm">

<label>Email</label>

<input
id="email"
type="email"
placeholder="Dispatcher email"
required>

<br><br>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
required>

<br><br>

<button class="login-btn" type="submit">
LOGIN
</button>

</form>

<div id="loginMessage"></div>

</div>



<!-- DISPATCHER PANEL -->

<div id="panel">

<div class="container">


<div class="box">

<button
class="logout"
onclick="logout()">
Logout
</button>

<h2>🚛 Dispatcher Panel</h2>

<p>Add and manage your trucks.</p>

</div>



<!-- ADD / EDIT FORM -->

<div class="box">

<h2 id="formTitle">
Add Truck
</h2>

<form id="truckForm">

<input
type="hidden"
id="truck_id">

<div class="form-grid">


<div>

<label>Truck Number</label>

<input
id="truck_number"
required>

</div>


<div>

<label>Driver Name</label>

<input
id="driver_name"
required>

</div>


<div>

<label>Current Location</label>

<input
id="location"
required>

</div>


<div>

<label>Available Date</label>

<input
id="available_date"
type="date"
required>

</div>


<div>

<label>Available Time</label>

<input
id="available_time"
type="time"
required>

</div>


<div>

<label>Preferred Lane</label>

<input
id="lane"
placeholder="WA → CA">

</div>


<div>

<label>Equipment</label>

<select id="equipment">

<option>53' Dry Van</option>
<option>53' Reefer</option>
<option>Flatbed</option>
<option>Step Deck</option>
<option>Other</option>

</select>

</div>


<div>

<label>Status</label>

<select id="status">

<option value="Available">Available</option>
<option value="Booked">Booked</option>
<option value="Not Available">Not Available</option>

</select>

</div>


<div class="full">

<label>Notes</label>

<textarea id="notes"></textarea>

</div>


<div class="full">

<button
class="add-btn"
type="submit">

ADD TRUCK

</button>

</div>

</div>

</form>

<div id="message"></div>

</div>



<!-- TRUCK LIST -->

<div class="box">

<h2>📋 My Trucks</h2>

<div id="truckList">
Loading...
</div>

</div>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lriojwlaxemghavidsjt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_HFnwZD1cccBr6RsIDhZPbA_MxHGK0T6";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMessage");

msg.innerHTML = "Logging in...";

const { data, error } =
await supabaseClient.auth.signInWithPassword({
email: email,
password: password
});

if (error) {

msg.innerHTML =
"❌ " + error.message;

return;

}

msg.innerHTML = "";

showPanel();

});



/* SHOW PANEL */

function showPanel() {

document
.getElementById("loginBox")
.style.display = "none";

document
.getElementById("panel")
.style.display = "block";

loadTrucks();

}



/* CHECK EXISTING LOGIN */

async function checkLogin() {

const { data } =
await supabaseClient.auth.getSession();

if (data.session) {

showPanel();

}

}

checkLogin();



/* LOGOUT */

async function logout() {

await supabaseClient.auth.signOut();

location.reload();

}



/* LOAD TRUCKS */

async function loadTrucks() {

const list =
document.getElementById("truckList");

list.innerHTML = "Loading...";

const { data, error } =
await supabaseClient
.from("trucks")
.select("*")
.order("id", { ascending: false });

if (error) {

list.innerHTML =
"❌ " + error.message;

return;

}

if (!data || data.length === 0) {

list.innerHTML =
"No trucks found.";

return;

}

list.innerHTML = "";

data.forEach(function(truck) {

const div =
document.createElement("div");

div.className = "truck";

div.innerHTML = `

<h3>🚛 Truck #${truck.truck_number}</h3>

<p>
<strong>Driver:</strong>
${truck.driver_name || ""}
</p>

<p>
<strong>Location:</strong>
${truck.location || ""}
</p>

<p>
<strong>Available:</strong>
${truck.available_date || ""}
 ${truck.available_time || ""}
</p>

<p>
<strong>Lane:</strong>
${truck.lane || "Any"}
</p>

<p>
<strong>Equipment:</strong>
${truck.equipment || ""}
</p>

<p>
<strong>Status:</strong>
${truck.status || ""}
</p>

<p>
<strong>Notes:</strong>
${truck.notes || ""}
</p>

<div class="actions">

<button
class="edit"
onclick='editTruck(${JSON.stringify(truck)})'>
✏️ EDIT
</button>

<button
class="delete"
onclick="deleteTruck(${truck.id})">
🗑️ DELETE
</button>

</div>

`;

list.appendChild(div);

});

}



/* ADD / UPDATE */

document
.getElementById("truckForm")
.addEventListener("submit", async function(e) {

e.preventDefault();

const id =
document.getElementById("truck_id").value;

const truck = {

truck_number:
document.getElementById("truck_number").value,

driver_name:
document.getElementById("driver_name").value,

location:
document.getElementById("location").value,

available_date:
document.getElementById("available_date").value,

available_time:
document.getElementById("available_time").value,

lane:
document.getElementById("lane").value,

equipment:
document.getElementById("equipment").value,

status:
document.getElementById("status").value,

notes:
document.getElementById("notes").value

};


let result;


if (id) {

result =
await supabaseClient
.from("trucks")
.update(truck)
.eq("id", id);

} else {

result =
await supabaseClient
.from("trucks")
.insert(truck);

}


const message =
document.getElementById("message");


if (result.error) {

message.innerHTML =
"❌ " + result.error.message;

return;

}


message.innerHTML =
"✅ Saved successfully!";

resetForm();

loadTrucks();

});



/* EDIT */

function editTruck(truck) {

document.getElementById("formTitle")
.innerHTML = "Edit Truck";

document.getElementById("truck_id")
.value = truck.id;

document.getElementById("truck_number")
.value = truck.truck_number || "";

document.getElementById("driver_name")
.value = truck.driver_name || "";

document.getElementById("location")
.value = truck.location || "";

document.getElementById("available_date")
.value = truck.available_date || "";

document.getElementById("available_time")
.value = truck.available_time || "";

document.getElementById("lane")
.value = truck.lane || "";

document.getElementById("equipment")
.value = truck.equipment || "53' Dry Van";

document.getElementById("status")
.value = truck.status || "Available";

document.getElementById("notes")
.value = truck.notes || "";

window.scrollTo({
top: 0,
behavior: "smooth"
});

}



/* DELETE */

async function deleteTruck(id) {

if (!confirm(
"Are you sure you want to delete this truck?"
)) {
return;
}

const { error } =
await supabaseClient
.from("trucks")
.delete()
.eq("id", id);

if (error) {

alert("❌ " + error.message);

return;

}

alert("✅ Truck deleted.");

loadTrucks();

}



/* RESET FORM */

function resetForm() {

document
.getElementById("truckForm")
.reset();

document
.getElementById("truck_id")
.value = "";

document
.getElementById("formTitle")
.innerHTML = "Add Truck";

}

</script>

</body>
</html>
